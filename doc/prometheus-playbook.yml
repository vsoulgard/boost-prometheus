site:
  url: https://github.com/vsoulgard/boost-prometheus/tree/master
  title: Boost.Prometheus
  robots: allow
  start_page: prometheus::index.adoc

antora:
  extensions:
    - require: '@cppalliance/antora-cpp-reference-extension'
      dependencies:
        - name: 'boost'
          repo: 'https://github.com/boostorg/boost.git'
          tag: 'develop'
          variable: 'BOOST_SRC_DIR'
          system-env: 'BOOST_SRC_DIR'
    - require: '@cppalliance/antora-downloads-extension'

content:
  sources:
    - url: ..
      start_path: doc
      edit_url: 'https://github.com/vsoulgard/boost-prometheus/edit/develop/{path}'

ui: 
  bundle:
    url: https://github.com/boostorg/website-v2-docs/releases/download/ui-master/ui-bundle.zip
    snapshot: true

output:
  dir: html

asciidoc:
  attributes:
    page-pagination: ''
